<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>UPSIDERチェック</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --fg: #e7ecf1;
      --muted: #9aa7b5;
      --card: #1a2330;
      --accent: #3d8bfd;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f8;
        --fg: #142033;
        --muted: #5b6b7c;
        --card: #ffffff;
        --accent: #1a66d8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 4px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">プレースホルダー</div>
    <h1>UPSIDERチェック</h1>
    <p>外部サイト移行用の公開URLを確定するための初期ページです。現行Canvasの機能はこれから段階的に移植します。</p>
  </main>
</body>
</html>
